version: 1
applications:
  - appRoot: portfolio-site
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - env | grep -E '^(APP_REGION|CONTACT_|ANALYTICS_|COGNITO_|ADMIN_BASE_PATH|CLOUDWATCH_|RESUME_S3_BUCKET|NEXT_PUBLIC_)=' >> .env.production || true
            - npm run build -- --webpack
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
